# controller-icons.yaml — DeviceType → icon mapping (SPEC §8.4)
#
# Maps InputPlumber DeviceType strings to SVG icon names and human-readable
# display names.  Unknown DeviceType strings fall back to "generic-gamepad"
# with the raw type string as the label (SPEC §8.4).
#
# Icon names correspond to SVG files in data/icons/svg/ without the .svg
# extension.  Controllercons icons use the "cc-" prefix convention.
# Custom icons use plain names.
#
# License: Controllercons are SIL OFL 1.1 (see LICENSE.controllercons).
#          Custom SVGs are controller-box project (GPL-3.0).

virtual_types:
  # --- Xbox family ---
  - type: "xb360"
    icon: "cc-xbox-360"
    name: "Xbox 360 Controller"
  - type: "xbox-elite"
    icon: "cc-xbox-one"
    name: "Xbox One Elite Controller"
  - type: "xbox-series"
    icon: "cc-xbox-series-x"
    name: "Xbox Series S|X Controller"

  # --- PlayStation family ---
  - type: "ds5"
    icon: "cc-ps5"
    name: "DualSense"
  - type: "ds5-usb"
    icon: "cc-ps5"
    name: "DualSense (USB)"
  - type: "ds5-bt"
    icon: "cc-ps5"
    name: "DualSense (Bluetooth)"
  - type: "ds5-edge"
    icon: "cc-ps5"
    name: "DualSense Edge"
  - type: "ds5-edge-usb"
    icon: "cc-ps5"
    name: "DualSense Edge (USB)"
  - type: "ds5-edge-bt"
    icon: "cc-ps5"
    name: "DualSense Edge (Bluetooth)"

  # --- Steam Deck ---
  - type: "deck"
    icon: "cc-steam-deck"
    name: "Steam Deck Controller"
  - type: "deck-uhid"
    icon: "cc-steam-deck"
    name: "Steam Deck Controller (UHID)"

  # --- Generic gamepad ---
  - type: "gamepad"
    icon: "generic-gamepad"
    name: "Generic Gamepad"
  - type: "unified-gamepad"
    icon: "generic-gamepad"
    name: "Unified Gamepad"

  # --- Other controllers ---
  - type: "hori-steam"
    icon: "generic-gamepad"
    name: "HORIPAD Steam"
  - type: "8bitdo-u2"
    icon: "generic-gamepad"
    name: "8BitDo Ultimate 2"

  # --- Non-controller devices ---
  - type: "mouse"
    icon: "cc-mouse"
    name: "Mouse"
  - type: "keyboard"
    icon: "cc-keyboard"
    name: "Keyboard"
  - type: "touchpad"
    icon: "generic-gamepad"
    name: "Touchpad"
  - type: "touchscreen"
    icon: "generic-gamepad"
    name: "Touchscreen"

  # --- Special / internal ---
  - type: "null"
    icon: "generic-gamepad"
    name: "Null Device"
  - type: "dbus"
    icon: "generic-gamepad"
    name: "DBus Device"
  - type: "debug"
    icon: "generic-gamepad"
    name: "Debug Device"

# Custom icons available for profile overrides (SPEC §8.5)
# These are not mapped to a specific DeviceType but can be used
# in profile metadata sidecar "icon:" field.
custom_icons:
  - icon: "arcade-stick"
    name: "Arcade Stick"
  - icon: "hitbox"
    name: "Hit Box"