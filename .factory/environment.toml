schema_version = 1

# Minimal Ralph factory — runner declarations.
# SSH aliases, credentials, and provisioning stay outside the repository.
# Capabilities are strings; the factory does not infer or invent them.

# dev-runner-vm: general-purpose dev VM with systemd, uinput, and packages.
[[runners]]
name = "dev-runner-vm"
transport = "ssh"
ssh_config_alias = "dev-runner-vm"
working_directory = "/srv/dev-runner/workspaces/controller-box"
capabilities = ["remote-project-gate", "systemd-user", "kernel-uinput", "installed-package"]
verify_command = "./scripts/verify-project.sh"

# iprunner: dedicated runner for the physical InputPlumber system-bus,
# physical-controller, target-consumer, and controller-production-routing
# capabilities. Hardware probes live in scripts/runner-probes/iprunner-probes/.
[[runners]]
name = "iprunner"
transport = "ssh"
ssh_config_alias = "iprunner"
working_directory = "/srv/dev-runner/workspaces/iprunner"
capabilities = ["inputplumber-system-dbus", "physical-controller", "target-consumer", "controller-production-routing"]
verify_command = "./scripts/verify-project.sh"

# gpurunner: dedicated runner for the gpu-compositor capability.
# Hardware probes live in scripts/runner-probes/gpurunner-probes/.
[[runners]]
name = "gpurunner"
transport = "ssh"
ssh_config_alias = "gpurunner"
working_directory = "/srv/dev-runner/workspaces/gpurunner"
capabilities = ["gpu-compositor", "installed-licensed-diagram"]
verify_command = "./scripts/verify-project.sh"