# Optional machine visual-audit methodology (Controller-Box).
#
# See the generic boilerplate .factory/visual-audit.toml for the full
# description. Controller's production reviewer is fixed to the authenticated
# Pi2 vision authority and exact model identity below. The feature remains
# disabled until a genuine image-byte probe and the complete independently
# accepted calibration set both pass. Captures are exact-commit installed
# production windows, serial and isolated, under the dedicated lease.
schema_version = 1

[visual-audit]
enabled = false
vision_model = "ollama/kimi-k2.6"
sdk_driver = "scripts/visual-audit-review-sdk.mjs"
lease_file = ".factory-state/visual-audit.lease"
review_parallelism = 4
review_timeout_seconds = 300
capture_driver = "scripts/visual-capture-driver.sh"
capture_dir = ".factory/artifacts/visual-audit/captures"
review_dir = ".factory/artifacts/visual-audit/reviews"
prompt_template = ".factory/prompts/visual-audit.md"
review_schema = ".factory/schemas/visual-audit-review.schema.json"
calibration_set = ".factory/visual-audit-calibration.json"
inventory = ".factory/visual-audit-inventory.json"
