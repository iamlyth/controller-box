<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Mandatory host policy: candidate runner identities may reach InputPlumber
     only through the root-owned mediator's independent connection. -->
<busconfig>
  <policy user="devrunner">
    <deny send_destination="org.shadowblip.InputPlumber"/>
  </policy>
  <policy user="iprunner">
    <deny send_destination="org.shadowblip.InputPlumber"/>
  </policy>
  <policy user="gpurunner">
    <deny send_destination="org.shadowblip.InputPlumber"/>
  </policy>
</busconfig>
