# Planning-only loop. It may update IMPLEMENTATION_PLAN.md, never product code.
cli:
  backend: "pi"
  command: "./scripts/pi2-ollama.sh"

event_loop:
  prompt_file: "prompts/PLAN.md"
  completion_promise: "PLAN_COMPLETE"
  starting_event: "factory.plan"
  max_iterations: 20
  max_runtime_seconds: 31536000

core:
  scratchpad: ".ralph/agent/scratchpad.md"
  specs_dir: "docs/"

features:
  parallel: false
  auto_merge: false

hats:
  planner:
    name: "Factory Planner"
    description: "Read-only decomposition coordinator for the committed specification."
    triggers: ["factory.plan"]
    publishes: ["factory.plan"]
    default_publishes: "factory.plan"
    instructions: |
      Follow prompts/PLAN.md exactly. Coordinate read-only Pi subagents, write only
      IMPLEMENTATION_PLAN.md and the recovery scratchpad, and never implement code.

hooks:
  enabled: true
  defaults:
    timeout_seconds: 30
  events:
    pre.iteration.start:
      - name: branch-guard
        command: ["./scripts/branch-guard.sh"]
        on_error: block
    post.iteration.start:
      - name: planning-scope
        command: ["./scripts/plan-scope-guard.sh"]
        on_error: block
      - name: planning-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--plan-only"]
        on_error: block
      - name: ollama-usage-wait
        command: ["./scripts/ollama-usage-guard.sh", "--wait"]
        timeout_seconds: 691200
        on_error: block
    pre.loop.complete:
      - name: final-planning-gate
        command: ["./scripts/final-gate.sh", "--planning"]
        on_error: block
      - name: final-planning-checkpoint
        command: ["./scripts/git-commit-hook.sh", "--plan-only"]
        on_error: block
